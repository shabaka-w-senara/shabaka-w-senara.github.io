      const script = document.createElement('script');
      script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
      script.async = true;
      script.onerror = function () {
        console.warn('تعذر تحميل مكتبة مسح الباركود بالكاميرا من الشبكة.');
      };
      document.head.appendChild(script);
    }

    window.addEventListener('error', function (event) {
      const targetTag = event && event.target && event.target.tagName;
      if (targetTag === 'SCRIPT') {
        event.preventDefault();
        console.warn('تم تجاهل خطأ تحميل سكربت خارجي:', event.target.src || 'unknown');
      }
    }, true);

    function normalizeCashierProfiles(parsedSettings) {
      if (Array.isArray(parsedSettings.cashierProfiles) && parsedSettings.cashierProfiles.length > 0) {
        const cleaned = parsedSettings.cashierProfiles
          .filter(p => p && String(p.name || '').trim())
          .map(p => ({
            name: String(p.name).trim(),
            pin: String(p.pin || '1111').trim() || '1111'
          }));
        if (cleaned.length > 0) return cleaned;
      }

      if (Array.isArray(parsedSettings.cashiers) && parsedSettings.cashiers.length > 0) {
        return parsedSettings.cashiers
          .map(n => String(n || '').trim())
          .filter(Boolean)
          .map((name, idx) => ({
            name,
            pin: idx === 0 ? '1111' : '1234'
          }));
      }

      return DEFAULT_SETTINGS.cashierProfiles.map(p => ({ ...p }));
    }

    function loadDataFromStorage() {
      try {
        const savedProducts = localStorage.getItem(STORAGE_KEYS.PRODUCTS);
        const savedSales = localStorage.getItem(STORAGE_KEYS.SALES);
        const savedCategories = localStorage.getItem(STORAGE_KEYS.CATEGORIES);
        const savedSettings = localStorage.getItem(STORAGE_KEYS.SETTINGS);

        products = savedProducts ? JSON.parse(savedProducts) : [...DEFAULT_PRODUCTS];
        sales = savedSales ? JSON.parse(savedSales) : [];
        categories = savedCategories ? JSON.parse(savedCategories) : [...DEFAULT_CATEGORIES];

        const parsedSettings = savedSettings ? JSON.parse(savedSettings) : {};
        const profiles = normalizeCashierProfiles(parsedSettings);

        settings = {
          ...DEFAULT_SETTINGS,
          ...parsedSettings,
          adminPin: String(parsedSettings.adminPin || DEFAULT_SETTINGS.adminPin).trim() || '9999',
          cashierProfiles: profiles,
          cashiers: profiles.map(p => p.name),
          shifts: Array.isArray(parsedSettings.shifts) && parsedSettings.shifts.length > 0
            ? parsedSettings.shifts
            : [...DEFAULT_SETTINGS.shifts],
          cloudRoomCode: String(parsedSettings.cloudRoomCode || DEFAULT_SETTINGS.cloudRoomCode).trim() || DEFAULT_SETTINGS.cloudRoomCode,
        };

        if (!settings.cashiers.includes(settings.activeCashier)) {
          settings.activeCashier = settings.cashiers[0];
        }
        if (!settings.shifts.includes(settings.activeShift)) {
          settings.activeShift = settings.shifts[0];
        }

        if (!savedProducts) localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(products));
        if (!savedCategories) localStorage.setItem(STORAGE_KEYS.CATEGORIES, JSON.stringify(categories));
        if (!savedSettings) localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings));
      } catch (err) {
        console.error('خطأ في قراءة البيانات:', err);
        products = [...DEFAULT_PRODUCTS];
        sales = [];
        categories = [...DEFAULT_CATEGORIES];
        settings = { ...DEFAULT_SETTINGS, cashierProfiles: DEFAULT_SETTINGS.cashierProfiles.map(p => ({ ...p })) };
        showToast('تم تحميل البيانات الافتراضية لوجود مشكلة في التخزين المحلي', 'warning');
      }
    }

    function persistAllState(syncCloud = true) {
      settings.cashiers = settings.cashierProfiles.map(p => p.name);
      localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(products));
      localStorage.setItem(STORAGE_KEYS.SALES, JSON.stringify(sales));
      localStorage.setItem(STORAGE_KEYS.CATEGORIES, JSON.stringify(categories));
      localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings));
      updateLowStockBadge();

      if (syncCloud && !isApplyingCloudSnapshot) {
        pushStateToCloud();
      }
    }

    // المزامنة السحابية عبر Firebase Firestore عند توفر التكوين أو كود المزامنة
    async function initCloudSyncFromSDK() {
      const sdk = window.__CLOUD_SDK__;
      if (!sdk) return;

      try {
        const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '';
        if (!rawConfig) {
          updateCloudBadges(false);
          return;
        }

        const firebaseConfig = typeof rawConfig === 'string' ? JSON.parse(rawConfig) : rawConfig;
        const appId = typeof __app_id !== 'undefined' && __app_id ? String(__app_id) : 'shabaka-w-senara';
        const roomCode = sanitizeRoomCode(settings.cloudRoomCode || 'shabaka-w-senara-pos');

        const app = sdk.initializeApp(firebaseConfig);
        const auth = sdk.getAuth(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await sdk.signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await sdk.signInAnonymously(auth);
        }

        const db = sdk.getFirestore(app);
        cloudDocRef = sdk.doc(db, 'artifacts', appId, 'public', 'data', 'store_pos_rooms', roomCode);

        if (typeof cloudUnsubscribe === 'function') {
          cloudUnsubscribe();
        }

        const snap = await sdk.getDoc(cloudDocRef);
        if (snap.exists()) {
          applyCloudData(snap.data());
        } else {
          await pushStateToCloud();
        }

        cloudUnsubscribe = sdk.onSnapshot(
          cloudDocRef,
          (docSnap) => {
            cloudConnected = true;
            updateCloudBadges(true);
            if (docSnap.exists() && !docSnap.metadata.hasPendingWrites) {
              applyCloudData(docSnap.data());
            }
          },
          (err) => {
            console.warn('خطأ في الاستماع السحابي:', err);
            cloudConnected = false;
            updateCloudBadges(false);
          }
        );

        cloudConnected = true;
        updateCloudBadges(true);
      } catch (err) {
        console.warn('تعذر الاتصال بالمزامنة السحابية:', err);
        cloudConnected = false;
        updateCloudBadges(false);
      }
    }

    function sanitizeRoomCode(code) {
      return String(code || 'shabaka-w-senara-pos')
        .trim()
        .replace(/[^a-zA-Z0-9_-]/g, '_') || 'shabaka-w-senara-pos';
    }

    async function pushStateToCloud() {
      const sdk = window.__CLOUD_SDK__;
      if (!sdk || !cloudDocRef) return;
      try {
        await sdk.setDoc(cloudDocRef, {
          updatedAt: new Date().toISOString(),
          products,
          sales,
          categories,
          settings
        }, { merge: true });
      } catch (err) {
        console.warn('تعذر رفع التحديث للسحابة:', err);
      }
    }

    function applyCloudData(remoteData) {
      if (!remoteData) return;
      isApplyingCloudSnapshot = true;
      try {
        if (Array.isArray(remoteData.products)) products = remoteData.products;
        if (Array.isArray(remoteData.sales)) sales = remoteData.sales;
        if (Array.isArray(remoteData.categories) && remoteData.categories.length > 0) {
          categories = remoteData.categories;
        }
        if (remoteData.settings && typeof remoteData.settings === 'object') {
          const profiles = normalizeCashierProfiles(remoteData.settings);
          settings = {
            ...DEFAULT_SETTINGS,
            ...settings,
            ...remoteData.settings,
            cashierProfiles: profiles,
            cashiers: profiles.map(p => p.name),
          };
        }

        localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(products));
        localStorage.setItem(STORAGE_KEYS.SALES, JSON.stringify(sales));
        localStorage.setItem(STORAGE_KEYS.CATEGORIES, JSON.stringify(categories));
        localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings));

        applySettingsToUI();
        populateCategoryControls();
        populateStaffControls();
        populateAuthGateControls();
        updateLowStockBadge();
        renderPosProducts();
        renderCart();
        if (!document.getElementById('tab-inventory').classList.contains('hidden')) renderInventoryTable();
        if (!document.getElementById('tab-reports').classList.contains('hidden')) renderReports();
        if (!document.getElementById('tab-settings').classList.contains('hidden')) fillSettingsForm();
      } finally {
        isApplyingCloudSnapshot = false;
      }
    }

    function updateGateCashierHint() {
      const cSelect = document.getElementById('gate-cashier-select');
      const hintEl = document.getElementById('gate-pin-hint');
      if (!cSelect || !hintEl) return;
      const profile = settings.cashierProfiles.find(p => p.name === cSelect.value) || settings.cashierProfiles[0];
      hintEl.textContent = `أدخل رمز PIN الخاص بـ "${profile ? profile.name : 'الكاشير'}" لفتح الشيفت (الافتراضي: ${profile ? profile.pin : '1111'})`;

    function handleCashierLogin(e) {
      e.preventDefault();
      const cashierName = document.getElementById('gate-cashier-select').value;
      const shiftName = document.getElementById('gate-shift-select').value;
      const enteredPin = document.getElementById('gate-cashier-pin').value.trim();

      const profile = settings.cashierProfiles.find(p => p.name === cashierName);
      if (!profile) {
        showToast('يرجى اختيار كاشير صحيح', 'error');
        return;
      }

      if (enteredPin !== String(profile.pin)) {
        showToast('رمز PIN الخاص بالكاشير غير صحيح', 'error');
        document.getElementById('gate-cashier-pin').select();
        return;
      }

      settings.activeCashier = cashierName;
      settings.activeShift = shiftName;
      saveSettings();

      currentSession = {
        authenticated: true,
        role: 'cashier',
        cashierName,
        shiftName,
      };

      document.getElementById('gate-cashier-pin').value = '';
      hideAuthGate();
      populateStaffControls();
      updateRoleVisibility();
      switchTab('pos');
      showToast(`مرحباً ${cashierName} — تم بدء ${shiftName}`, 'success');
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const enteredPin = document.getElementById('gate-admin-pin').value.trim();
      if (enteredPin !== String(settings.adminPin || '9999')) {
        showToast('رمز PIN الخاص بالإدارة غير صحيح', 'error');

      if (isAdmin()) {

      pendingAdminCallback = callback;
      document.getElementById('admin-pin-modal-reason').textContent = reasonText;
      const input = document.getElementById('admin-pin-modal-input');
      input.value = '';

      modal.classList.remove('hidden');

      modal.classList.remove('flex');

        showToast('رمز PIN الخاص بالإدارة غير صحيح', 'error');

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      activeBtn.classList.add('bg-cyan-500', 'text-slate-950', 'shadow');
      activeBtn.classList.remove('text-slate-200', 'hover:bg-white/10');

        if (stockFilter === 'available') matchesStock = p.stock > p.minStock;
        else if (stockFilter === 'low') matchesStock = p.stock > 0 && p.stock <= p.minStock;

    function openEditInvoiceModal(invoiceId) {
      const inv = sales.find(s => s.id === invoiceId);
      if (!inv) return;

      const details = inv.paymentDetails || {};
      document.getElementById('edit-inv-id').value = inv.id;
      document.getElementById('edit-inv-code-label').textContent = inv.id;
      document.getElementById('edit-inv-customer').value = inv.customer || 'عميل نقدي';
      document.getElementById('edit-inv-payment-method').value = inv.paymentMethod || 'كاش';
      document.getElementById('edit-inv-discount').value = Number(inv.discount || 0);
      document.getElementById('edit-inv-wallet-provider').value = details.walletProvider || 'فودافون كاش';
      document.getElementById('edit-inv-sender-phone').value = details.senderPhone || '';
      document.getElementById('edit-inv-ref-number').value = details.referenceNumber || '';

      toggleEditInvoiceProofFields();

      const modal = document.getElementById('edit-invoice-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeEditInvoiceModal() {
      const modal = document.getElementById('edit-invoice-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleEditInvoiceProofFields() {
      const method = document.getElementById('edit-inv-payment-method').value;
      document.getElementById('edit-inv-wallet-fields').classList.toggle('hidden', method !== 'محفظة إلكترونية');
      document.getElementById('edit-inv-instapay-fields').classList.toggle('hidden', method !== 'إنستاباي');
    }

    function saveEditedInvoice(e) {
      e.preventDefault();
      if (!isAdmin()) {
        showToast('تعديل الفواتير متاح للإدارة فقط', 'error');
        return;
      }

      const id = document.getElementById('edit-inv-id').value;
      const idx = sales.findIndex(s => s.id === id);
      if (idx === -1) return;

      const inv = sales[idx];
      const customer = document.getElementById('edit-inv-customer').value.trim() || 'عميل نقدي';
      const method = document.getElementById('edit-inv-payment-method').value;
      const discount = Math.min(Math.max(0, parseFloat(document.getElementById('edit-inv-discount').value) || 0), inv.subtotal);
      const afterDiscount = inv.subtotal - discount;
      const taxAmount = (afterDiscount * (inv.taxRate || 0)) / 100;
      const grandTotal = afterDiscount + taxAmount;
      const netProfit = afterDiscount - (inv.totalCost || 0);

      let paymentDetails = {
        method,
        walletProvider: '',
        senderPhone: '',
        referenceNumber: '',
        summaryLabel: method,
      };

      if (method === 'محفظة إلكترونية') {
        const walletProvider = document.getElementById('edit-inv-wallet-provider').value;
        const senderPhone = document.getElementById('edit-inv-sender-phone').value.trim();
        if (!senderPhone) {
          showToast('يرجى إدخال الرقم الذي تم التحويل منه', 'error');
          return;
        }
        paymentDetails.walletProvider = walletProvider;
        paymentDetails.senderPhone = senderPhone;
        paymentDetails.summaryLabel = `${walletProvider} (${senderPhone})`;
      } else if (method === 'إنستاباي') {
        const referenceNumber = document.getElementById('edit-inv-ref-number').value.trim();
        if (!referenceNumber) {
          showToast('يرجى إدخال الرقم المرجعي لإنستاباي', 'error');
          return;
        }
        paymentDetails.referenceNumber = referenceNumber;
        paymentDetails.summaryLabel = `إنستاباي - مرجع: ${referenceNumber}`;
      }

      sales[idx] = {
        ...inv,
        customer,
        discount,
        taxAmount,
        grandTotal,
        netProfit,
        paymentMethod: method,
        paymentDetails,
        amountPaid: method === 'كاش' ? Math.max(grandTotal, inv.amountPaid || grandTotal) : grandTotal,
        changeDue: 0,
      };

      saveSales();
      closeEditInvoiceModal();
      renderReports();
      showToast(`تم تحديث الفاتورة ${id} بنجاح`, 'success');
    }
